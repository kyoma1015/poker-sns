name: Diagnosis PNG-error acceptance
on:
  pull_request:
    branches: [codex/issue22-d-image-error-input-20261021]
permissions:
  contents: read
concurrency:
  group: diagnosis-image-error-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Immutable diagnosis gesture and error-redaction acceptance
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --test tests/worker-acceptance.test.mjs
      - name: Offline unit regression
        run: |
          for test_file in tests/*.test.mjs; do
            node "$test_file"
          done
      - run: npm run build
      - run: npm run lint
      - name: Existing diagnosis mobile regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/browser/diagnosis.mjs
