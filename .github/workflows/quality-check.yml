name: Quality Check
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'chore/autonomous-dev-foundation-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Oxlint
        run: npm run lint
