name: Worker stdin cleanup and liveness bounds QA
on:
  pull_request:
    branches: [codex/a-worker-recovery-qa-20261023]
    paths:
      - 'scripts/code_worker.py'
      - 'tests/automation/test_worker_io_bounds.py'
      - 'tests/automation/test_host_unknown_liveness.py'
      - 'tests/automation/test_worker_tree_boundaries.py'
      - 'tests/automation/owned_tree_probe.py'
      - 'tests/automation/test_unknown_liveness_expiry.py'
      - '.github/workflows/worker-io-bounds.yml'
permissions:
  contents: read
concurrency:
  group: worker-io-bounds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  isolated-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Immutable acceptance
        run: python -B -m unittest discover -s tests/worker_acceptance -v
      - name: Existing worker queue controller and recovery regressions
        run: |
          python -B tests/automation/test_code_worker.py
          python -B tests/automation/test_development_queue.py
          python -B tests/automation/test_controller_integration.py -v
          python -B tests/automation/test_worker_recovery_lifecycle.py -v
          python -B tests/automation/test_command_process_cleanup.py -v
      - name: Ten bounded stdin cleanup and descendant rounds
        run: |
          for round in $(seq 1 10); do
            python -B tests/automation/test_worker_io_bounds.py -v || exit 1
            python -B tests/automation/test_host_unknown_liveness.py -v || exit 1
            ISSUE22_OWNED_TREE_METRICS="$RUNNER_TEMP/owned-tree.jsonl" python -B tests/automation/test_worker_tree_boundaries.py -v || exit 1
            python -B tests/automation/test_unknown_liveness_expiry.py -v || exit 1
          done
      - name: Preserve fixture-only process and reap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-stdin-tree-metrics
          path: ${{ runner.temp }}/owned-tree.jsonl
          retention-days: 7
          if-no-files-found: warn
