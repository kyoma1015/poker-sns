name: Changed MOV conversion browser validation
on:
  pull_request:
    paths:
      - 'src/videoMovConversion.ts'
      - 'src/Timeline.tsx'
      - 'tests/video/mov_conversion_browser.mjs'
      - '.github/workflows/video-mov-conversion.yml'
permissions:
  contents: read
jobs:
  mov-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -b --pretty false && npx vite build
      - run: npm run lint
      # GitHub-hosted Ubuntu runners include FFmpeg and Google Chrome.
      # Do not use apt: the previous run timed out downloading FFmpeg.
      - run: |
          command -v ffmpeg
          command -v ffprobe
          command -v google-chrome || command -v google-chrome-stable
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: node tests/video/mov_conversion_browser.mjs
