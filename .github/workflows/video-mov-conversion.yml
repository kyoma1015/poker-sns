name: Changed MOV conversion browser validation
on:
  pull_request:
    paths:
      - 'src/videoMovConversion.ts'
      - 'src/Timeline.tsx'
      - 'tests/video/mov_conversion_browser.mjs'
      - '.github/workflows/video-mov-conversion.yml'
permissions:
  contents: read
jobs:
  mov-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -b --pretty false && npx vite build
      - run: npm run lint
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node tests/video/mov_conversion_browser.mjs
