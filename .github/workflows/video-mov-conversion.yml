name: Changed MOV conversion browser validation
on:
  pull_request:
    paths:
      - 'src/videoMovConversion.ts'
      - 'src/Timeline.tsx'
      - 'tests/video/mov_conversion_browser.mjs'
      - '.github/workflows/video-mov-conversion.yml'
permissions:
  contents: read
jobs:
  mov-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -b --pretty false && npx vite build
      - run: npm run lint
      # Runner image may omit FFmpeg; install it with a bounded step.
      - name: Install FFmpeg for disposable MOV fixtures
        timeout-minutes: 18
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: node node_modules/playwright-core/cli.js install --with-deps chrome
      - run: node tests/video/mov_conversion_browser.mjs
