name: Video backup synthetic integrity QA (NO PRODUCTION ACCESS)
on:
  pull_request:
    paths:
      - '.github/workflows/video-backup-synthetic-qa.yml'
      - '.github/workflows/video-manual-encrypted-backup.yml'
      - 'scripts/video_backup_storage.py'
      - 'scripts/video_verify_backup_bundle.py'
      - 'scripts/video_verify_isolated_db_restore.sh'
      - 'tests/video/test_manual_backup_integrity.py'
permissions:
  contents: read
jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m py_compile scripts/video_backup_storage.py scripts/video_verify_backup_bundle.py tests/video/test_manual_backup_integrity.py
      - name: Shell syntax check
        run: bash -n scripts/video_verify_isolated_db_restore.sh
      - name: Offline integrity and Storage overwrite tests
        run: python3 -m unittest discover -s tests/video -p test_manual_backup_integrity.py -v
