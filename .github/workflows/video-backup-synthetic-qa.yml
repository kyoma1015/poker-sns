name: Video backup synthetic integrity QA (NO PRODUCTION ACCESS)
on:
  pull_request:
    paths:
      - '.github/workflows/video-backup-synthetic-qa.yml'
      - '.github/workflows/video-manual-encrypted-backup.yml'
      - 'scripts/video_backup_storage.py'
      - 'scripts/video_backup_preflight.py'
      - 'tests/video/test_backup_preflight.py'
      - 'scripts/video_verify_backup_bundle.py'
      - 'scripts/video_verify_isolated_storage_restore.py'
      - 'scripts/video_verify_isolated_db_restore.sh'
      - 'tests/video/test_manual_backup_integrity.py'
      - 'tests/video/test_storage_api_restore_contract.py'
      - 'tests/video/isolated_postgres_acl_restore.sh'
      - 'tests/video/isolated_storage_metadata_restore.sh'
permissions:
  contents: read
jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m py_compile scripts/video_backup_storage.py scripts/video_backup_preflight.py scripts/video_verify_backup_bundle.py scripts/video_verify_isolated_storage_restore.py tests/video/test_manual_backup_integrity.py tests/video/test_storage_api_restore_contract.py
      - name: Shell syntax check
        run: bash -n scripts/video_verify_isolated_db_restore.sh
      - name: Offline integrity and Storage overwrite tests
        run: python3 -m unittest discover -s tests/video -p test_manual_backup_integrity.py -v
      - name: Offline JIT, Storage credential and DB origin fail-closed preflight
        run: python3 -m unittest discover -s tests/video -p test_backup_preflight.py -v
      - name: Isolated PostgreSQL 17 owner ACL RLS restore E2E
        run: bash tests/video/isolated_postgres_acl_restore.sh
      - name: Mock Storage API restore, private bucket and DB metadata checks
        run: python3 -m unittest discover -s tests/video -p test_storage_api_restore_contract.py -v
      - name: PostgreSQL-backed Storage metadata, bucket and bytes restore E2E
        run: bash tests/video/isolated_storage_metadata_restore.sh
