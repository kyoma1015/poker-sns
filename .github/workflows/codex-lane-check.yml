name: Codex lane checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-lane-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Offline regression tests (no Supabase credentials)
        run: |
          for test_file in tests/*.test.mjs; do
            node "$test_file"
          done
      - run: npm run build
      - run: npm run lint

