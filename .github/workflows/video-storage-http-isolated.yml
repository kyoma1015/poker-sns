name: Video Storage HTTP isolated QA
on:
  pull_request:
    paths:
      - 'tests/video/**'
      - 'api/video-*.ts'
      - 'src/PostVideo.tsx'
      - 'src/Timeline.tsx'
      - 'tests/video-published-delete-guard.test.mjs'
      - 'tests/video-ffprobe-runtime.test.mjs'
      - 'src/videoApi.ts'
      - 'sql/post_short_videos_candidate.sql'
      - 'sql/post_short_videos_immutable_review_only.sql'
      - 'sql/video_permanent_key_reservation_review_only.sql'
      - 'scripts/bundle-ffprobe.mjs'
      - '.github/workflows/video-storage-http-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-storage-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Restore pinned Supabase Docker image cache
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/pokerid-supabase-images.tar
          key: pokerid-supabase-cli-2.81.3-images-v1
      - name: Load cached images
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/pokerid-supabase-images.tar
      - name: Install ffmpeg for real media probe
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if command -v ffprobe >/dev/null 2>&1 && command -v ffmpeg >/dev/null 2>&1; then
            ffprobe -version | head -n 1
            exit 0
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=15s 180s apt-get install -y -qq -o DPkg::Lock::Timeout=30 ffmpeg
          command -v ffprobe
          ffprobe -version | head -n 1
      - name: Enforce real ffprobe runtime tests without skip
        env:
          REQUIRE_FFPROBE_RUNTIME: 'true'
        run: node --test tests/video-ffprobe-runtime.test.mjs
      - name: Verify pinned ffprobe build bundle without deploying
        run: |
          node scripts/bundle-ffprobe.mjs
          test -x api/bin/ffprobe
          api/bin/ffprobe -version
          file api/bin/ffprobe
      - name: Install Chromium for actual React playback QA
        run: npx playwright-core install --with-deps chromium
      - name: Isolated Supabase Storage HTTP E2E
        run: bash tests/video/run_storage_http_isolated.sh
      - name: Save local images to cache on success
        if: success() && steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(supabase|postgrest|kong)' | xargs -r docker save -o /tmp/pokerid-supabase-images.tar
      - name: Cache pinned Supabase images
        if: success() && steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/pokerid-supabase-images.tar
          key: pokerid-supabase-cli-2.81.3-images-v1
