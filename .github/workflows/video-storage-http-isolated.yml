name: Video Storage HTTP isolated QA
on:
  pull_request:
    paths:
      - 'tests/video/**'
      - 'sql/post_short_videos_candidate.sql'
      - '.github/workflows/video-storage-http-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-storage-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Isolated Supabase Storage HTTP E2E
        run: bash tests/video/run_storage_http_isolated.sh
