name: Video Storage HTTP isolated QA
on:
  pull_request:
    paths:
      - 'tests/video/**'
      - 'api/video-*.ts'
      - 'src/PostVideo.tsx'
      - 'src/Timeline.tsx'
      - 'tests/video-published-delete-guard.test.mjs'
      - 'tests/video-ffprobe-runtime.test.mjs'
      - 'src/videoApi.ts'
      - 'sql/post_short_videos_candidate.sql'
      - 'sql/post_short_videos_immutable_review_only.sql'
      - '.github/workflows/video-storage-http-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-storage-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Restore pinned Supabase Docker image cache
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/pokerid-supabase-images.tar
          key: pokerid-supabase-cli-2.81.3-images-v1
      - name: Load cached images
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/pokerid-supabase-images.tar
      - name: Install ffmpeg for real media probe
        run: sudo apt-get install -y -qq ffmpeg
      - name: Enforce real ffprobe runtime tests without skip
        env:
          REQUIRE_FFPROBE_RUNTIME: 'true'
        run: node --test tests/video-ffprobe-runtime.test.mjs
      - name: Install Chromium for actual React playback QA
        run: npx playwright-core install --with-deps chromium
      - name: Isolated Supabase Storage HTTP E2E
        run: bash tests/video/run_storage_http_isolated.sh
      - name: Save local images to cache on success
        if: success() && steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(supabase|postgrest|kong)' | xargs -r docker save -o /tmp/pokerid-supabase-images.tar
      - name: Cache pinned Supabase images
        if: success() && steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/pokerid-supabase-images.tar
          key: pokerid-supabase-cli-2.81.3-images-v1
