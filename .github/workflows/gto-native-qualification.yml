name: GTO full-game qualification boundary verification
on:
  push:
    branches: ['codex/c-native-hand169-bridge-20261023']
    paths:
      - 'gto/qualification/**'
      - 'docs/qa/preflop-qualification-20261117/**'
      - 'docs/specs/GTO_PREFLOP_RELEASE_PROPOSAL_20261117.md'
      - '.github/workflows/gto-native-qualification.yml'
  pull_request:
    paths:
      - 'gto/qualification/**'
      - 'docs/qa/preflop-qualification-20261117/**'
      - 'docs/specs/GTO_PREFLOP_RELEASE_PROPOSAL_20261117.md'
      - '.github/workflows/gto-native-qualification.yml'
permissions:
  contents: read
jobs:
  independent-native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned vectorized payoff dependency
        run: python -m pip install numpy==2.3.5
      - name: Compile original pinned native State without solver training
        run: python -B -m gto.qualification.build --directory "$RUNNER_TEMP/native-qualification"
      - name: Compile internal public-range continuation kernel
        env:
          RANGE_BUILD: '${{ runner.temp }}/range-continuation'
        run: python -B -c "import os; from gto.qualification.range_continuation import build; build(os.environ['RANGE_BUILD'])"
      - name: Verify frozen evidence and independent native replay
        env:
          QUALIFICATION_BUILD: '${{ runner.temp }}/native-qualification'
          RANGE_BUILD: '${{ runner.temp }}/range-continuation'
        run: python -B -m unittest gto.qualification.test_qualification gto.qualification.test_public_response gto.qualification.test_native_mccfr gto.qualification.test_variance_mccfr gto.qualification.test_average_support gto.qualification.test_action_baseline gto.qualification.test_conditional_action gto.qualification.test_blind_oracle gto.qualification.test_coverage_solver gto.qualification.preflop_release_tests gto.qualification.test_release_deviation gto.qualification.test_range_continuation gto.qualification.test_range_evaluation gto.qualification.test_preflop_reopt gto.qualification.test_coupled_preflop gto.qualification.test_joint_release gto.qualification.test_fullstreet gto.qualification.test_multiplayer_scope gto.qualification.test_generalize gto.qualification.test_sparse_solver gto.qualification.test_multiplayer_expanded -v
