name: GTO flop ablation verification
on:
  push:
    branches:
      - codex/c-native-hand169-bridge-20261023
    paths:
      - 'gto/abstract/flop_tree_ablation.py'
      - 'gto/abstract/flop_reach_adapter.py'
      - 'gto/abstract/frozen_flop_reach.py'
      - 'gto/abstract/frozen_flop_ablation.py'
      - 'tests/test_flop_tree_ablation.py'
      - 'tests/test_flop_reach_adapter.py'
      - 'tests/test_frozen_flop_reach.py'
      - 'tests/test_frozen_flop_ablation.py'
      - '.github/workflows/gto-flop-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate independent flop model
        run: python -m unittest tests/test_flop_tree_ablation.py tests/test_flop_reach_adapter.py tests/test_frozen_flop_reach.py tests/test_frozen_flop_ablation.py -v
