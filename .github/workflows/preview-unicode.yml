name: Offline discovery Unicode safety
on:
  pull_request:
    branches: [codex/a-preview-unicode-input-20261022]
permissions:
  contents: read
concurrency:
  group: preview-unicode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests/worker_acceptance -v
      - run: python -B tests/automation/test_code_worker.py
      - run: python -B tests/automation/test_development_queue.py
