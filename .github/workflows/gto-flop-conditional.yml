name: GTO fixed-flop conditional equity verification
on:
  push:
    branches: ['codex/c-native-hand169-bridge-20261023']
    paths:
      - 'gto/abstract/flop_conditional.py'
      - 'tests/test_flop_conditional.py'
      - 'docs/qa/flop-conditional-20261031/**'
      - '.github/workflows/gto-flop-conditional.yml'
permissions:
  contents: read
jobs:
  conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent exact990, public/private removal and frozen posterior
        run: python -B -m unittest tests.test_flop_conditional -v
      - name: Real frozen policies, exact conditional runouts and sampling intervals
        run: |
          python -B -m gto.abstract.flop_conditional --build-dir "$RUNNER_TEMP/conditional" --output "$RUNNER_TEMP/flop.json" --samples 32
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/flop.json" --expected docs/qa/flop-conditional-20261031/results.json
