name: Worker immutable acceptance
on:
  pull_request:
    branches: ['codex/issue22-worker-input-*']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if [ -f tests/worker-acceptance.test.mjs ]; then
            node tests/worker-acceptance.test.mjs
          else
            python -B -m unittest discover -s tests/worker_acceptance -v
          fi
