name: Video SQL isolated QA
on:
  pull_request:
    paths:
      - 'sql/post_short_videos_candidate.sql'
      - 'tests/video/**'
      - '.github/workflows/video-sql-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-sql-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Isolated PostgreSQL video schema and RLS
        run: bash tests/video/run_isolated.sh
      - name: Install ffmpeg for isolated media validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Trusted finalization core unit tests
        run: python3 -m unittest tests.video.test_finalize_core -v
      - name: Authenticated finalize boundary unit tests
        run: python3 -m unittest tests.video.test_finalize_boundary -v
      - name: Local HTTP finalize contract tests
        run: python3 -m unittest tests.video.test_local_http -v
      - name: Supabase Auth JWT adapter unit tests
        run: python3 -m unittest tests.video.test_supabase_auth_adapter -v
      - name: Private Storage download adapter unit tests
        run: python3 -m unittest tests.video.test_storage_download_adapter -v
      - name: Cleanup worker safety unit tests
        run: python3 -m unittest tests.video.test_cleanup_worker_core -v
      - name: Trusted-server ffprobe duration validation prototype
        run: bash -x tests/video/test_server_validate.sh
