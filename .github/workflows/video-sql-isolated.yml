name: Video SQL isolated QA
on:
  pull_request:
    paths:
      - 'sql/post_short_videos_candidate.sql'
      - 'tests/video/**'
      - '.github/workflows/video-sql-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-sql-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Isolated PostgreSQL video schema and RLS
        run: bash tests/video/run_isolated.sh
      - name: Install ffmpeg for isolated media validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Trusted-server ffprobe duration validation prototype
        run: bash -x tests/video/test_server_validate.sh
