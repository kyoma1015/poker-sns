name: GTO joint reach and private continuation integration
on:
  push:
    branches: ['codex/c-native-hand169-bridge-20261023']
    paths:
      - 'gto/abstract/joint_reach*'
      - 'tests/test_joint_reach.py'
      - 'docs/qa/joint-reach-20261107/**'
      - '.github/workflows/gto-joint-reach.yml'
permissions:
  contents: read
jobs:
  joint-reach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify unchanged frozen solvers, prior research and UI
        run: |
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          for folder in ['independent-preflop-20261105','suit-exact-preflop-20261106','continuation-audit-20261106']:
           m=json.loads(Path('docs/qa',folder,'dependency-manifest.json').read_text())
           for group in m.values():
            for p,h in group.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          print('PASS all prior protected identities')
          PY
      - name: Independent information, counterfactual reach and BR regressions
        run: python -B -m unittest tests.test_joint_reach -v
      - name: Replay exact known-board joint learning and full-tree BR
        run: |
          python -B -m gto.abstract.joint_reach_study --build-dir "$RUNNER_TEMP/joint-build" --cache-dir "$RUNNER_TEMP/joint-cache" --output "$RUNNER_TEMP/joint-result.json"
          python -B -m gto.abstract.independent_verify --actual "$RUNNER_TEMP/joint-result.json" --expected docs/qa/joint-reach-20261107/results.json
