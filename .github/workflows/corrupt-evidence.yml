name: Running evidence fail-closed and activation CAS
on:
  pull_request:
    branches: [codex/a-host-stop-boundary-20261023]
    paths:
      - 'scripts/code_worker.py'
      - 'scripts/continuation_recovery.py'
      - 'scripts/private_journal.py'
      - 'scripts/journal_checkpoint.py'
      - 'src/DirectMessageChat.tsx'
      - 'src/DirectMessages.tsx'
      - 'src/Notifications.tsx'
      - 'tests/notifications-flow.test.mjs'
      - 'tests/browser/notifications-flow*'
      - 'tests/direct-message-inbox.test.mjs'
      - 'tests/browser/dm-*.tsx'
      - 'tests/browser/dm-*.ts'
      - 'tests/direct-message-send.test.mjs'
      - 'tests/automation/**'
      - 'tests/automation/test_corrupt_evidence.py'
      - 'tests/automation/test_evidence_activation.py'
      - 'tests/automation/test_activation_cas.py'
      - '.github/workflows/corrupt-evidence.yml'
permissions:
  contents: read
concurrency:
  group: corrupt-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  isolated-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Complete isolated automation regressions
        run: python -B -m unittest discover -s tests/automation -v
      - name: Existing protected worker queue WAL CAS recovery and host boundaries
        run: |
          python -B -m unittest discover -s tests/worker_acceptance -v
          python -B tests/automation/test_code_worker.py
          python -B tests/automation/test_development_queue.py
          python -B tests/automation/test_controller_integration.py
          python -B tests/automation/test_worker_recovery_lifecycle.py
          python -B tests/automation/test_host_call_boundary.py
          python -B tests/automation/test_host_boundary_restart.py
          python -B tests/automation/test_unknown_liveness_expiry.py
      - name: Ten corrupt evidence and multiprocess activation rounds
        run: |
          for round in $(seq 1 10); do
            python -B tests/automation/test_corrupt_evidence.py -v || exit 1
            python -B tests/automation/test_evidence_activation.py -v || exit 1
            python -B tests/automation/test_activation_cas.py -v || exit 1
          done
      - name: Locked frontend dependencies
        run: npm ci --cache "$RUNNER_TEMP/pokerid-npm-cache"
      - name: Synthetic React and existing frontend regressions
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -eu
          for suite in tests/*.test.mjs; do node "$suite"; done
      - run: npm run build
      - run: npm run lint
