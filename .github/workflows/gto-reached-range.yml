name: GTO preregistered reached-range generalization
on:
  push:
    branches: ['codex/c-native-hand169-bridge-20261023']
    paths:
      - 'gto/abstract/range_*'
      - 'gto/abstract/reached_range.cc'
      - 'gto/abstract/generalization_features.py'
      - 'gto/abstract/continuation_game*'
      - 'gto/abstract/continuation_learning.py'
      - 'gto/abstract/flop_exact*'
      - 'gto/abstract/flop_conditional.py'
      - 'gto/abstract/frozen_flop_reach.py'
      - 'gto/abstract/precision_native.cc'
      - 'gto/abstract/model.py'
      - 'gto/hand169.py'
      - 'docs/qa/ev-precision-20261030/frozen-inputs.json'
      - 'docs/qa/range-generalization-20261101/**'
      - 'tests/test_reached_range.py'
      - '.github/workflows/gto-reached-range.yml'
permissions:
  contents: read
jobs:
  reached_range:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check preregistration, immutable selection and preserved base
        run: |
          python -B - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          root=Path('docs/qa/range-generalization-20261101')
          digest=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          lock=json.loads((root/'selection-lock.json').read_text())
          assert digest(root/'protocol.json')==lock['protocol_sha256']
          assert digest(root/'selection.json')==lock['selection_sha256']
          dep=json.loads((root/'dependency-manifest.json').read_text())
          assert all(digest(p)==h for p,h in dep['preserved_dependency_sha256'].items())
          print('PASS preregistered source/selection/base')
          PYCODE
      - name: Public history posterior, own-information and phase-isolation tests
        run: python -B -m unittest tests.test_reached_range -v
      - name: Reproduce train/validation selection without final boards
        run: |
          python -B -m gto.abstract.range_study --phase select --build-dir "$RUNNER_TEMP/selection" --output "$RUNNER_TEMP/selection.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/selection.json" --expected docs/qa/range-generalization-20261101/selection.json
      - name: Exact final evaluation of already locked range and uniform policies
        run: |
          python -B -m gto.abstract.range_study --phase final --selection docs/qa/range-generalization-20261101/selection.json --build-dir "$RUNNER_TEMP/final" --output "$RUNNER_TEMP/final.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/final.json" --expected docs/qa/range-generalization-20261101/final-results.json
      - name: Readonly train/validation audit of the same locked policies
        run: |
          python -B -m gto.abstract.range_study --phase audit --selection docs/qa/range-generalization-20261101/selection.json --build-dir "$RUNNER_TEMP/audit" --output "$RUNNER_TEMP/audit.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/audit.json" --expected docs/qa/range-generalization-20261101/training-audit.json
