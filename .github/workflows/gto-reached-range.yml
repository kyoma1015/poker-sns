name: GTO matched-factorial generalization and information floor
on:
  push:
    branches: ['codex/c-native-hand169-bridge-20261023']
    paths:
      - 'gto/abstract/range_*'
      - 'gto/abstract/factorial_*'
      - 'tests/test_factorial_generalization.py'
      - 'docs/qa/factorial-generalization-20261104/**'
      - 'gto/abstract/reached_range.cc'
      - 'gto/abstract/generalization_features.py'
      - 'gto/abstract/continuation_game*'
      - 'gto/abstract/continuation_learning.py'
      - 'gto/abstract/flop_exact*'
      - 'gto/abstract/flop_conditional.py'
      - 'gto/abstract/frozen_flop_reach.py'
      - 'gto/abstract/precision_native.cc'
      - 'gto/abstract/model.py'
      - 'gto/hand169.py'
      - 'docs/qa/ev-precision-20261030/frozen-inputs.json'
      - 'docs/qa/range-generalization-20261101/**'
      - 'tests/test_reached_range.py'
      - '.github/workflows/gto-reached-range.yml'
permissions:
  contents: read
jobs:
  reached_range:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check preregistration, immutable selection and preserved base
        run: |
          python -B - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          root=Path('docs/qa/range-generalization-20261101')
          digest=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          lock=json.loads((root/'selection-lock.json').read_text())
          assert digest(root/'protocol.json')==lock['protocol_sha256']
          assert digest(root/'selection.json')==lock['selection_sha256']
          dep=json.loads((root/'dependency-manifest.json').read_text())
          assert all(digest(p)==h for p,h in dep['preserved_dependency_sha256'].items())
          new=json.loads(Path('docs/qa/factorial-generalization-20261104/dependency-manifest.json').read_text())
          assert all(digest(p)==h for p,h in new['preserved_and_research_source_sha256'].items())
          print('PASS preregistered source/selection/base')
          PYCODE
      - name: Public history posterior, own-information and phase-isolation tests
        run: python -B -m unittest tests.test_reached_range -v
      - name: Matched-factorial projection, leakage and floor tests
        run: python -B -m unittest tests.test_factorial_generalization -v
      - name: Reproduce matched teachers and validation-only selection
        run: |
          python -B -m gto.abstract.factorial_study --phase select --build-dir "$RUNNER_TEMP/factorial-select" --output "$RUNNER_TEMP/factorial-selection.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/factorial-selection.json" --expected docs/qa/factorial-generalization-20261104/selection.json
      - name: Reproduce frozen final without fitting or reselection
        run: |
          python -B -m gto.abstract.factorial_study --phase final --build-dir "$RUNNER_TEMP/factorial-final" --output "$RUNNER_TEMP/factorial-final.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/factorial-final.json" --expected docs/qa/factorial-generalization-20261104/final-results.json
      - name: Reproduce separately labelled information-floor diagnostics
        run: |
          python -B -m gto.abstract.factorial_study --phase diagnose --build-dir "$RUNNER_TEMP/factorial-diagnostics" --output "$RUNNER_TEMP/factorial-diagnostics.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/factorial-diagnostics.json" --expected docs/qa/factorial-generalization-20261104/diagnostics.json
      - name: Reproduce readonly known-anchor and worst-type attribution
        run: |
          python -B -m gto.abstract.factorial_audit --build-dir "$RUNNER_TEMP/factorial-audit" --output "$RUNNER_TEMP/factorial-audit.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/factorial-audit.json" --expected docs/qa/factorial-generalization-20261104/error-attribution.json
