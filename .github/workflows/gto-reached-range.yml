name: GTO conditional-value learning and bounded response verification
on:
  push:
    branches: ['codex/c-native-hand169-bridge-20261023']
    paths:
      - 'gto/abstract/range_*'
      - 'gto/abstract/factorial_*'
      - 'gto/abstract/value_*'
      - 'tests/test_value_response.py'
      - 'docs/qa/value-response-20261104/**'
      - 'tests/test_factorial_generalization.py'
      - 'docs/qa/factorial-generalization-20261104/**'
      - 'gto/abstract/reached_range.cc'
      - 'gto/abstract/generalization_features.py'
      - 'gto/abstract/continuation_game*'
      - 'gto/abstract/continuation_learning.py'
      - 'gto/abstract/flop_exact*'
      - 'gto/abstract/flop_conditional.py'
      - 'gto/abstract/frozen_flop_reach.py'
      - 'gto/abstract/precision_native.cc'
      - 'gto/abstract/model.py'
      - 'gto/hand169.py'
      - 'docs/qa/ev-precision-20261030/frozen-inputs.json'
      - 'docs/qa/range-generalization-20261101/**'
      - 'tests/test_reached_range.py'
      - '.github/workflows/gto-reached-range.yml'
permissions:
  contents: read
jobs:
  reached_range:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check preregistration, immutable selection and preserved base
        run: |
          python -B - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          root=Path('docs/qa/range-generalization-20261101')
          digest=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          lock=json.loads((root/'selection-lock.json').read_text())
          assert digest(root/'protocol.json')==lock['protocol_sha256']
          assert digest(root/'selection.json')==lock['selection_sha256']
          dep=json.loads((root/'dependency-manifest.json').read_text())
          assert all(digest(p)==h for p,h in dep['preserved_dependency_sha256'].items())
          new=json.loads(Path('docs/qa/factorial-generalization-20261104/dependency-manifest.json').read_text())
          assert all(digest(p)==h for p,h in new['preserved_and_research_source_sha256'].items())
          print('PASS preregistered source/selection/base')
          PYCODE
      - name: Public history posterior, own-information and phase-isolation tests
        run: python -B -m unittest tests.test_reached_range -v
      - name: Matched-factorial projection, leakage and floor tests
        run: python -B -m unittest tests.test_factorial_generalization -v
      - name: Conditional posterior EV and independent response update tests
        run: python -B -m unittest tests.test_value_response -v
      - name: Reproduce train and validation selection without final boards
        run: |
          python -B -m gto.abstract.value_study --phase select --build-dir "$RUNNER_TEMP/value-select" --output "$RUNNER_TEMP/value-selection.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/value-selection.json" --expected docs/qa/value-response-20261104/selection.json
      - name: Locked final inference with fixed declared local response budget
        run: |
          python -B -m gto.abstract.value_study --phase final --build-dir "$RUNNER_TEMP/value-final" --output "$RUNNER_TEMP/value-final.json"
          python -B -m gto.abstract.verify_export --actual "$RUNNER_TEMP/value-final.json" --expected docs/qa/value-response-20261104/final-results.json
