name: Manual encrypted production backup (NO RESTORE / NO RELEASE)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-manual-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production-backup
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic backup integrity self-check (no credentials)
        run: python3 -m unittest discover -s tests/video -p test_manual_backup_integrity.py -v
      - name: Export DB + Storage, encrypt before upload
        shell: bash
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          PROD_STORAGE_READ_KEY: ${{ secrets.PROD_STORAGE_READ_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          for key in PROD_DB_URL PROD_SUPABASE_URL PROD_STORAGE_READ_KEY BACKUP_AGE_RECIPIENT; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Missing required configuration: $key"; exit 2; fi
          done
          [[ "$PROD_DB_URL" == *sslmode=require* || "$PROD_DB_URL" == *sslmode=verify-full* ]] || { echo "::error::DB URL must explicitly enable TLS"; exit 2; }
          # Prevent accidental use of an unapproved public destination or customer-controlled URL.
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r"age1[023456789acdefghjklmnpqrstuvwxyz]{58}", os.environ["BACKUP_AGE_RECIPIENT"]), "Invalid age recipient"
          PY
          [[ "$PROD_SUPABASE_URL" == "https://ephptepeuespnxtzdqby.supabase.co" ]] || { echo "::error::Wrong Supabase project URL"; exit 2; }
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq age >/dev/null
          tmp="$RUNNER_TEMP/poker-backup-$GITHUB_RUN_ID"
          mkdir -m 700 "$tmp"
          chmod 700 "$tmp"
          trap 'rm -rf -- "$tmp"' EXIT
          # PostgreSQL 17 client; this extracts database contents but DOES NOT certify restorable Supabase platform config.
          docker run --rm -e PROD_DB_URL -v "$tmp:/backup" postgres:17             sh -ec 'pg_dump --dbname "$PROD_DB_URL" --format=custom --no-owner --no-acl -f /backup/database.dump && test -s /backup/database.dump'
          export BACKUP_STORAGE_DIR="$tmp/storage"
          export EXPECTED_STORAGE_OBJECTS=7 EXPECTED_STORAGE_BUCKETS=4
          python3 scripts/video_backup_storage.py
          (cd "$tmp" && sha256sum database.dump > database.sha256)
          # Never upload the plaintext bundle or any plaintext Actions artifact.
          tar -C "$tmp" -cf - database.dump database.sha256 storage | age -r "$BACKUP_AGE_RECIPIENT" -o "$tmp/encrypted-backup.tar.age"
          test -s "$tmp/encrypted-backup.tar.age"
          # Ciphertext only: GitHub artifact is a temporary transfer, NOT durable backup.
          mkdir -m 700 -p "$RUNNER_TEMP/poker-encrypted-artifact"
          cp "$tmp/encrypted-backup.tar.age" "$RUNNER_TEMP/poker-encrypted-artifact/backup.tar.age"
          echo "Encrypted archive ready for temporary Actions artifact transport."
          echo "NOT RELEASE READY: archive must be downloaded to independent private storage and fully restored."
      - name: Temporarily transfer encrypted archive (never plaintext)
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-video-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/poker-encrypted-artifact/backup.tar.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Delete encrypted local transfer copy
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/poker-encrypted-artifact"
