name: Main hand169 isolated export
on:
  pull_request:
    branches: [main]
    paths:
      - 'gto/hand169.py'
      - 'gto/tests/test_hand169.py'
      - 'tests/worker_acceptance/**'
      - '.github/workflows/hand169-main.yml'
permissions:
  contents: read
concurrency:
  group: hand169-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests/worker_acceptance -v
      - run: python -B -m unittest discover -s gto/tests -v
