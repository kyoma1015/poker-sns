name: GTO reconstructed native verification
on:
  pull_request:
    branches: [main, codex/integration-poll-only-20261020, codex/c-gto-active-milestones-20261020, codex/c-native-training-batch-20261023]
    paths:
      - 'gto/**'
      - 'handoff/gto/**'
      - '.github/workflows/gto-native-reconstructed.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gto-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconstructed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure Python validation
        run: python -B -m unittest discover -s gto/tests -v
      - name: Transferred source verification
        run: |
          python handoff/gto/verify_native_solvers.py
          python handoff/gto/tests/run_backend_tests.py
          python -B handoff/gto/g12_next/g12_p1_live_backend_tests.py
      - name: Pinned reconstruction (not original G11 vendor)
        run: python -B gto/native/build_reconstructed.py --work-root "$RUNNER_TEMP/gto-reconstructed-$GITHUB_RUN_ID"
      - name: Actual native finite batches and exact checkpoint continuation
        run: |
          for variant in g12_next g12_p1_cache g12_p1_packed; do
            GTO_NATIVE_MODULE_DIR="$RUNNER_TEMP/gto-reconstructed-$GITHUB_RUN_ID/$variant" python -B gto/native/test_training_batch.py -v
          done
      - name: Native poker throughput and toy-only NashConv observations
        run: |
          for variant in g12_next g12_p1_cache g12_p1_packed; do
            python -B gto/native/benchmark_training.py --module-dir "$RUNNER_TEMP/gto-reconstructed-$GITHUB_RUN_ID/$variant"
          done
      - name: Native hand169 bridge and exact small-poker policy oracles
        run: |
          for variant in g12_next g12_p1_cache g12_p1_packed; do
            GTO_NATIVE_MODULE_DIR="$RUNNER_TEMP/gto-reconstructed-$GITHUB_RUN_ID/$variant" python -B gto/native/test_hand169_bridge.py -v
            GTO_NATIVE_MODULE_DIR="$RUNNER_TEMP/gto-reconstructed-$GITHUB_RUN_ID/$variant" python -B gto/native/test_hand169_bridge_boundaries.py -v
          done
      - name: Exact reused PR103 hand169 dependency acceptance
        run: python -B -m unittest discover -s tests/worker_acceptance -v
