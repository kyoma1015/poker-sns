name: Poll PG17 synthetic restore (no production access)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/poll-pg17-synthetic-restore.yml'
permissions:
  contents: read
jobs:
  synthetic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGUSER: postgres
      PGPASSWORD: synthetic_only_not_a_secret
    steps:
      - name: Synthetic PostgreSQL 17 dump/restore and compatibility report
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/poll-synthetic"
          mkdir -p "$work"
          cleanup() {
            local failed=0
            trap - EXIT
            for c in poll-synth-src poll-synth-dst; do
              docker rm -f "$c" >/dev/null 2>&1 || true
              if docker container inspect "$c" >/dev/null 2>&1; then
                echo "::error::Synthetic container still exists: $c"
                failed=1
              fi
            done
            rm -rf -- "$work" || failed=1
            if test -e "$work"; then
              echo "::error::Synthetic temporary directory remains"
              failed=1
            fi
            if test "$failed" -eq 0; then
              echo 'PASS: containers absent and temporary dump directory removed'
            fi
            return "$failed"
          }
          trap 'status=$?; cleanup || status=1; exit "$status"' EXIT
          docker run -d --name poll-synth-src -e POSTGRES_PASSWORD="$PGPASSWORD" --network none postgres:17 >/dev/null
          docker run -d --name poll-synth-dst -e POSTGRES_PASSWORD="$PGPASSWORD" --network none postgres:17 >/dev/null
          for c in poll-synth-src poll-synth-dst; do
            ready=0
            for i in $(seq 1 45); do
              if docker exec "$c" pg_isready -U postgres >/dev/null 2>&1; then ready=1; break; fi
              sleep 1
            done
            test "$ready" -eq 1
          done
          docker exec -i poll-synth-src psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema poll_fixture;
          create table poll_fixture.polls (id integer primary key, closes_at timestamptz not null, is_anonymous boolean not null);
          create table poll_fixture.responses (id integer primary key, poll_id integer not null references poll_fixture.polls(id), choice integer not null);
          insert into poll_fixture.polls values (1,'2026-10-22T00:00:00Z',true),(2,'2026-10-23T00:00:00Z',false);
          insert into poll_fixture.responses values (1,1,2),(2,1,1),(3,2,3);
          SQL
          docker exec poll-synth-src pg_dump -U postgres -n poll_fixture --no-owner --no-privileges -Fc postgres > "$work/fixture.dump"
          test -s "$work/fixture.dump"
          docker exec -i poll-synth-dst pg_restore -U postgres --exit-on-error --no-owner --no-privileges -d postgres < "$work/fixture.dump"
          src=$(docker exec poll-synth-src psql -U postgres -Atc "select md5(string_agg(id||':'||is_anonymous::text,',' order by id)) from poll_fixture.polls")
          dst=$(docker exec poll-synth-dst psql -U postgres -Atc "select md5(string_agg(id||':'||is_anonymous::text,',' order by id)) from poll_fixture.polls")
          test "$src" = "$dst"
          src=$(docker exec poll-synth-src psql -U postgres -Atc "select md5(string_agg(id||':'||poll_id||':'||choice,',' order by id)) from poll_fixture.responses")
          dst=$(docker exec poll-synth-dst psql -U postgres -Atc "select md5(string_agg(id||':'||poll_id||':'||choice,',' order by id)) from poll_fixture.responses")
          test "$src" = "$dst"
          test "$(docker exec poll-synth-dst psql -U postgres -Atc 'show server_version_num' | cut -c1-2)" = 17
          echo 'PASS: PostgreSQL 17 synthetic dump/restore and digests'
          echo 'BLOCKED: pg_cron 1.6.4 and supabase_vault 0.3.1 extension parity; vanilla postgres:17 does not establish it'
          {
            echo '## Synthetic restore result'
            echo 'PASS: PostgreSQL 17 fixture dump/restore; rows, references and digests match.'
            echo 'BLOCKED: pg_cron 1.6.4 and supabase_vault 0.3.1 production parity.'
            echo 'No production connection, credentials, user data, or uploaded artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
