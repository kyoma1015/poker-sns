name: HTTP transport security checks
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - tests/http-transport.test.mjs
      - .github/workflows/http-security.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: http-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node tests/http-transport.test.mjs
      - run: npm run build
      - run: npm run lint
