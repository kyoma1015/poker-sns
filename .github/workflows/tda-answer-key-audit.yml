name: Offline TDA answer-key audit
on:
  pull_request:
    branches: [codex/b-filter-values-fix-20261022, codex/b-answer-key-audit-20261023, codex/b-answer-conflict-audit-20261023]
    paths:
      - src/tdaQuizAnswerAudit.ts
      - tests/tda-answer-key-audit.test.mjs
      - tests/tda-answer-conflict-audit.test.mjs
      - scripts/tda-snapshot-audit.mjs
      - scripts/strict-json.mjs
      - tests/tda-json-ambiguity.test.mjs
      - tests/tda-snapshot-integrity.test.mjs
      - .github/workflows/tda-answer-key-audit.yml
permissions:
  contents: read
jobs:
  audit:
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fixed synthetic answer-key and existing regressions
        run: |
          set -eu
          for test_file in tests/*.test.mjs; do node "$test_file"; done
      - run: npm run build
      - run: npm run lint
